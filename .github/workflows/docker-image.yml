name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: docker login
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOKCER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker login -u $DOCKER_USER -p $DOKCER_PASSWORD

      - name: docke building
        run: |
          docker build -t elsantiagod/docker-graphql:0.0.2 .
          docker build -t elsantiagod/docker-graphql .
      - name: push docker image
        run: |
          docker push elsantiagod/docker-graphql:0.0.2
          docker push elsantiagod/docker-graphql
    # - name: Build the Docker image
    #   run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
